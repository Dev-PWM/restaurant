<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasaFlow — Order tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/masaflow.css"><link rel="stylesheet" href="/assets/masaflow-ui.css">
<style>
body{margin:0;background:#fafaf9;color:#292524;font-family:Outfit,system-ui,sans-serif}.tracking-shell{max-width:740px;margin:auto;padding:0 24px 50px}.tracking-header{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:25px 0}.tracking-brand{color:#ea580c;text-decoration:none;font-size:25px;font-weight:700}.tracking-actions{display:flex;gap:12px;align-items:center}.tracking-actions a{font-size:12px;color:#78716c;text-decoration:none}.tracking-status{background:white;border:1px solid #e7e5e4;border-radius:26px;padding:30px;text-align:center;margin-top:15px}.tracking-label{text-transform:uppercase;letter-spacing:.12em;color:#78716c;font-size:11px;font-weight:600;margin:0 0 10px}.tracking-status h1{font-size:30px;margin:0 0 10px}.tracking-number{color:#ea580c;font-size:24px;font-weight:700;margin:0 0 16px}.tracking-explainer{color:#78716c;font-size:14px;line-height:1.7;max-width:450px;margin:0 auto}.tracking-live{font-size:12px;color:#15803d;margin:20px 0 0}.tracking-live.stale{color:#9a3412}.tracking-steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:30px 0 0}.tracking-steps li{font-size:11px;color:#78716c;line-height:1.5}.tracking-step-dot{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#f5f5f4;border:1px solid #e7e5e4;margin:0 auto 10px;font-weight:700}.tracking-steps .done{color:#c2410c}.done .tracking-step-dot{background:#fff7ed;border-color:#fdba74}.tracking-steps [aria-current=step]{color:#c2410c;font-weight:700}.tracking-steps [aria-current=step] .tracking-step-dot{background:#ea580c;color:#fff;border-color:#ea580c;box-shadow:0 0 0 5px #fff7ed}.tracking-details{background:white;border:1px solid #e7e5e4;border-radius:24px;padding:26px;margin-top:20px}.tracking-details h2{font-size:20px;margin:0 0 17px}.tracking-meta{color:#78716c;font-size:13px;line-height:1.6;margin:0 0 20px}.tracking-items{list-style:none;margin:0;padding:0}.tracking-items li{display:flex;justify-content:space-between;gap:18px;padding:16px 0;border-bottom:1px solid #f5f5f4}.tracking-items strong{font-size:14px}.tracking-items small{display:block;font-size:12px;color:#78716c;line-height:1.6;margin-top:4px;overflow-wrap:anywhere}.tracking-totals{padding-top:17px}.tracking-row{display:flex;justify-content:space-between;gap:15px;font-size:14px;margin:12px 0}.tracking-grand{font-size:19px;font-weight:700;border-top:1px solid #e7e5e4;padding-top:17px}.tracking-payment{font-size:12px;color:#9a3412;background:#fff7ed;padding:12px 15px;border-radius:12px;margin:19px 0 0}.tracking-payment.paid{background:#f0fdf4;color:#15803d}.tracking-error{color:#9f1239;font-size:13px;line-height:1.7;margin:17px 0 0}.tracking-error:empty{display:none}.tracking-link{display:inline-block;text-decoration:none;border-radius:14px;background:#292524;color:#fff;padding:14px 20px;margin-top:22px;font-size:14px;font-weight:600}.tracking-print{width:100%;margin-top:20px;border:1px solid #d6d3d1;border-radius:12px;background:#fff;padding:13px;font-size:13px}button,a{touch-action:manipulation}[hidden]{display:none!important}@media(max-width:540px){.tracking-shell{padding:0 18px 35px}.tracking-header{padding:20px 0;flex-wrap:wrap}.tracking-actions{gap:10px}.tracking-status{padding:26px 18px}.tracking-status h1{font-size:25px}.tracking-details{padding:22px}.tracking-steps{gap:5px}.tracking-steps li{font-size:10px}.tracking-step-dot{width:27px;height:27px}.tracking-explainer{font-size:13px}}
</style>
<script defer src="/assets/masaflow-store.js"></script><script defer src="/assets/masaflow-i18n.js"></script><script defer src="/assets/masaflow-ui.js"></script>
</head>
<body>
<div class="tracking-shell"><header class="tracking-header"><a href="MenuUI.html" class="tracking-brand">MasaFlow</a><div class="tracking-actions"><a href="MenuUI.html">Back to menu</a></div></header>
<main><section class="tracking-status" aria-live="polite" data-testid="tracking-status"><p class="tracking-label">Order tracking</p><h1 id="tracking-title">Loading your order…</h1><p id="tracking-number" class="tracking-number" data-testid="tracking-number" data-i18n-skip></p><p id="tracking-description" class="tracking-explainer"></p><p id="tracking-error" class="tracking-error" role="alert"></p><ol id="tracking-steps" class="tracking-steps" aria-label="Order tracking" hidden></ol><p id="tracking-live" class="tracking-live"></p><a id="tracking-menu" class="tracking-link" href="MenuUI.html" hidden>Back to menu</a></section>
<section id="tracking-details" class="tracking-details" hidden><h2>Order details</h2><p id="tracking-meta" class="tracking-meta"></p><ul id="tracking-items" class="tracking-items"></ul><div class="tracking-totals"><div class="tracking-row"><span>Subtotal</span><span id="tracking-subtotal"></span></div><div class="tracking-row"><span>Tax</span><span id="tracking-tax"></span></div><p id="tracking-tax-note" class="tracking-meta">Tax not configured</p><div class="tracking-row tracking-grand"><span>Total</span><span id="tracking-total" data-testid="tracking-total"></span></div></div><p id="tracking-payment" class="tracking-payment" data-testid="tracking-payment"></p><button id="tracking-print" class="tracking-print">Print receipt</button></section></main></div>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const M=window.MasaFlow,I=window.MasaFlowI18n,UI=window.MasaFlowUI,$=id=>document.getElementById(id),esc=UI.escape;
  const requested=new URLSearchParams(location.search).get('order');
  const orderId=typeof requested==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(requested)?requested:null;
  let confirmed=false,connected=false,lastOrder=null;
  const money=(value,record)=>M.money(value,record.currency,I.getLocale());
  const steps=['Awaiting payment','Received','Preparing','Ready to collect','Picked up'];
  function render(){
    $('tracking-error').textContent='';
    if(!orderId){$('tracking-title').textContent='No order selected';$('tracking-description').textContent='Use the tracking link from your order or place an order from the menu.';$('tracking-menu').hidden=false;return;}
    if(!confirmed){$('tracking-title').textContent=connected?'Loading your order…':'Unable to load your order';$('tracking-description').textContent='Reconnect to the local service. The last confirmed order remains visible when available.';return;}
    const order=M.getOrder(orderId)||lastOrder;
    if(!order){$('tracking-title').textContent='We could not find this order';$('tracking-description').textContent='Check your tracking link. Your order number alone is not a tracking link.';$('tracking-menu').hidden=false;$('tracking-live').textContent=connected?'Live order status':'Last confirmed status · reconnecting';return;}
    lastOrder=order;
    const paid=M.isVerifiedPaid(order),index=paid?Math.max(1,{pending:1,preparing:2,ready:3,completed:4}[order.status]||1):0;
    $('tracking-title').textContent=steps[index];$('tracking-number').textContent=order.number;
    $('tracking-description').textContent=['Pay your total at the counter. Preparation begins after the cashier records your payment.','Payment recorded. Your order is in the kitchen queue.','The kitchen is preparing your order.','Your order is ready. Show this order number at the counter.','Your order has been handed over. Thank you!'][index];
    if(order.paymentStatus==='paid'&&!paid)$('tracking-error').textContent='Recorded payment could not be verified. Please ask the cashier.';
    $('tracking-steps').hidden=false;$('tracking-steps').innerHTML=steps.map((label,step)=>`<li class="${step<index?'done':''}" ${step===index?'aria-current="step"':''}><span class="tracking-step-dot">${step<index?'✓':step+1}</span>${label}</li>`).join('');
    $('tracking-live').textContent=connected?'Live order status':'Last confirmed status · reconnecting';$('tracking-live').className='tracking-live'+(connected?'':' stale');
    $('tracking-details').hidden=false;
    const service=order.orderType==='dine_in'?'Dine in'+(order.tableNumber?' · Table '+order.tableNumber:''):order.orderType==='takeout'?'Takeout':'Counter pickup';
    $('tracking-meta').innerHTML=`<span data-i18n-skip>${esc(order.customerName)}</span><br><span>${esc(service)}</span> · <span data-i18n-skip>${esc(new Date(order.createdAt).toLocaleString(I.getLocale()==='es'?'es-MX':'en-US',{timeZone:M.getState().settings.timeZone}))}</span>`;
    $('tracking-items').innerHTML=order.items.map(line=>`<li><div><strong data-i18n-skip>${line.quantity} × ${esc(line.name)}</strong>${line.options.length?`<small data-i18n-skip>${line.options.map(option=>esc(option.name)).join(' · ')}</small>`:''}${line.notes?`<small data-i18n-skip>${esc(line.notes)}</small>`:''}</div><strong data-i18n-skip>${esc(money(line.lineTotalCents,order))}</strong></li>`).join('');
    $('tracking-subtotal').textContent=money(order.subtotalCents,order);$('tracking-tax').textContent=money(order.taxCents,order);$('tracking-total').textContent=money(order.totalCents,order);$('tracking-tax-note').hidden=order.taxCents!==0||M.getState().settings.taxConfigured;
    $('tracking-payment').textContent=paid?'Paid in cash':'Awaiting cash payment';$('tracking-payment').className='tracking-payment'+(paid?' paid':'');I.apply();
  }
  M.subscribe(()=>{confirmed=true;render();});I.subscribe(render);
  document.addEventListener('masaflow:connection',event=>{connected=event.detail.connected;if(connected)confirmed=true;render();});
  Promise.resolve(M.ready).then(()=>{confirmed=true;connected=true;render();}).catch(()=>{connected=false;render();});
  $('tracking-print').addEventListener('click',()=>{if(lastOrder)UI.printReceipt(lastOrder.id);});
  if(!orderId)render();
});
</script>
</body>
</html>
